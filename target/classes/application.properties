# ===================================================================
# 1. EMBEDDED SERVER CONFIGURATION
# ===================================================================
# Port number our REST API and embedded Tomcat server will listen on
server.port=8055

# ===================================================================
# 2. H2 IN-MEMORY DATABASE CONFIGURATION
# ===================================================================
# JDBC URL: 'mem' means in-memory (data lives in RAM, no disk install needed)
# 'bankingdb' is the database name
spring.datasource.url=jdbc:h2:mem:bankingdb

# The Java driver class that connects our app to H2
spring.datasource.driverClassName=org.h2.Driver

# Default administrative user ('sa' = System Administrator)
spring.datasource.username=sa

# Password left empty for easy local development
spring.datasource.password=

# ===================================================================
# 3. H2 BROWSER CONSOLE (WEB UI)
# ===================================================================
# Enables the built-in browser-based database viewer
spring.h2.console.enabled=true

# The URL path to open the database viewer in your browser (http://localhost:8055/h2-console)
spring.h2.console.path=/h2-console

# ===================================================================
# 4. JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Tells Hibernate to generate SQL syntax specifically tailored for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 'update' automatically creates/updates database tables based on our Java Entity classes
spring.jpa.hibernate.ddl-auto=update

# Prints all SQL queries (SELECT, INSERT, UPDATE) directly into the terminal log
spring.jpa.show-sql=true

# Pretty-prints the SQL queries across multiple lines so they are easy to read
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.web=DEBUG
logging.level.com.banking.customer=DEBUG