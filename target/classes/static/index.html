<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Customer Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Banking Customer Portal</h1>
        <div class="actions">
            <input type="text" id="searchInput" placeholder="Search by City (e.g., Dallas)...">
            <button onclick="searchCustomers()">🔍 Search</button>
            <button onclick="fetchAllCustomers()" class="btn-clear">📋 Get All Customers</button>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Add / Update Customer</h2>
            <!-- novalidate attribute disables all native browser validation tooltips -->
            <form id="customerForm" onsubmit="handleFormSubmit(event)" novalidate>
                <input type="hidden" id="customerId">

                <div class="form-grid">
                    <input type="text" id="firstName" placeholder="First Name">
                    <input type="text" id="lastName" placeholder="Last Name">
                    <input type="text" id="email" placeholder="Email (Unique)">
                    <input type="text" id="phone" placeholder="Phone Number">
                    <input type="text" id="nationalId" placeholder="National ID (Unique)">
                    <input type="text" id="city" placeholder="City (e.g. Dallas)">
                    <input type="text" id="address" placeholder="Full Address">
                    <select id="status">
                        <option value="">Select Status (Optional)</option>
                        <option value="ACTIVE" selected>ACTIVE</option>
                        <option value="SUSPENDED">SUSPENDED</option>
                        <option value="CLOSED">CLOSED</option>
                    </select>
                    <input type="number" step="0.01" id="balance" placeholder="Initial Balance" value="100.00">
                </div>

                <button type="submit" id="submitBtn">Save Customer</button>
                <button type="button" class="btn-clear" onclick="clearForm()">Clear Form</button>
            </form>
            <div id="errorBox" class="error-box" style="display: none; background: #fef2f2; border: 1px solid #f87171; padding: 12px; border-radius: 6px; margin-top: 15px;"></div>
        </div>

        <div class="table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>Customer Directory (<span id="customerCount">0</span>)</h2>
                <button onclick="fetchAllCustomers()" style="font-size: 13px; padding: 6px 12px;">🔄 Refresh List</button>
            </div>
            <table id="customerTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Status</th>
                    <th>Balance</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
